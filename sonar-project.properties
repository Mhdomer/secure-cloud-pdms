# SonarQube project configuration — Sprint 4 DevSecOps pipeline SAST stage
# (chapter-3 Section 3.4.5, chapter-4 Section 4.3.6). Consumed by
# .github/workflows/security-scan.yml. Credentials (SONAR_TOKEN,
# SONAR_HOST_URL) are supplied as GitHub Actions secrets, never here.

sonar.projectKey=secure-cloud-pdms
sonar.projectName=Secure Cloud PDMS (Alamin Clinic)
# Required for SonarCloud (unlike self-hosted SonarQube Server, which has no
# org concept) — SONAR_HOST_URL points at sonarcloud.io, confirmed by a live
# CI failure on 2026-07-30 ("You must define the following mandatory
# properties for 'secure-cloud-pdms': sonar.organization").
sonar.organization=mhdomer

sonar.sources=src/backend/src,src/frontend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,src/frontend/public/**

sonar.sourceEncoding=UTF-8
