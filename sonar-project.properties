# SonarQube project configuration — Sprint 4 DevSecOps pipeline SAST stage
# (chapter-3 Section 3.4.5, chapter-4 Section 4.3.6). Consumed by
# .github/workflows/security-scan.yml. Credentials (SONAR_TOKEN,
# SONAR_HOST_URL) are supplied as GitHub Actions secrets, never here.

# Project key is Mhdomer_secure-cloud-pdms, not the plain repo name — this
# is SonarCloud's own auto-generated key from importing the project via its
# GitHub App integration (organization login + repo name), confirmed
# directly on the project's Administration -> General Settings page. Using
# the wrong key here is indistinguishable, from the scanner's own error
# message, from the project not existing at all ("Not authorized or
# project not found... NOT_FOUND error, which can happen if the project
# does not exist yet") -- it does exist, this was just the wrong key.
sonar.projectKey=Mhdomer_secure-cloud-pdms
sonar.projectName=Secure Cloud PDMS (Alamin Clinic)
# Required for SonarCloud (unlike self-hosted SonarQube Server, which has no
# org concept) — SONAR_HOST_URL points at sonarcloud.io, confirmed by a live
# CI failure on 2026-07-30 ("You must define the following mandatory
# properties for 'secure-cloud-pdms': sonar.organization").
sonar.organization=mhdomer

sonar.sources=src/backend/src,src/frontend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,src/frontend/public/**

sonar.tests=src/backend/src
sonar.test.inclusions=**/__tests__/**/*.test.js

# Backend coverage — generated by `npm run test:coverage` (security-scan.yml
# runs this before the SonarQube scan step so the report exists on disk).
# Frontend has no test suite yet; only backend coverage is wired in for now.
sonar.javascript.lcov.reportPaths=src/backend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
