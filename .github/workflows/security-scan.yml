name: Security Scan

# Reusable workflow — the actual security gate for stages 2, 3, 4, and 5 of
# the 6-stage pipeline (chapter-4 Section 4.3.6): SonarQube SAST, Docker
# build, Trivy image scan, Checkov IaC scan. Both ci.yml (pull_request) and
# deploy.yml (push to main) call this workflow so the exact same checks run
# in both places — deploy.yml can never skip scanning just because it was
# triggered by something other than a reviewed PR (e.g. a direct push to
# main). Stage 1 (checkout) and stage 6 (Terraform Apply) are not here —
# checkout happens inside each job below as needed, and Terraform Apply
# only ever runs from deploy.yml, gated on this workflow's success.
#
# Every scan step is a hard gate: no step below sets continue-on-error, and
# every scanner is configured to exit non-zero on a finding at or above the
# thresholds documented in CLAUDE.md's "Security Gates (Non-Negotiable)"
# section — zero CRITICAL Trivy CVEs, zero unsuppressed Checkov findings
# (this project's existing modules already manage accepted exceptions via
# inline `# checkov:skip=...` justification comments, not a CLI severity
# filter, so the pipeline matches that established convention exactly).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sast:
    name: SonarQube SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube needs full git history for new-code/blame analysis

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: src/backend
        run: npm ci

      - name: Run backend tests with coverage
        # Generates src/backend/coverage/lcov.info, which
        # sonar.javascript.lcov.reportPaths (sonar-project.properties) reads
        # in the SonarQube Scan step below. No continue-on-error — a failing
        # test suite should block the gate exactly like any other finding.
        working-directory: src/backend
        run: npm run test:coverage

      - name: SonarQube Scan
        # v4 is EOL and flagged by GitHub as containing a known security
        # vulnerability (confirmed via a live run, 2026-07-30 — GitHub's own
        # runner annotation: "no longer supported and contains a security
        # vulnerability... update to sonarsource/sonarqube-scan-action@v6").
        # v8.2.1 was the latest available at the time of this fix; its
        # action.yml interface (env-var driven, same sonar-project.properties
        # convention) is unchanged from v4 for how this workflow uses it.
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          # sonar.projectVersion has never been set (confirmed via the
          # project's own analysis history: every past analysis shows
          # projectVersion "not provided"), so the "previous_version" New
          # Code Definition has been anchored to this project's very first
          # scan (2026-07-27) the entire time -- every commit since then
          # counts as "new code" needing 80% coverage, not just each PR's
          # own diff. Passing a value that changes on every run (the
          # workflow run number) makes each analysis its own version,
          # which resets the baseline to "since the last analysis" instead
          # of "since 2026-07-27" -- this is what actually makes the
          # coverage gate track real per-PR diffs going forward.
          args: -Dsonar.projectVersion=${{ github.run_number }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # No continue-on-error — a non-OK quality gate (which includes
        # SonarQube's hardcoded-secret and SQL-injection rule sets, per
        # chapter-3 Section 3.4.5) fails this job and blocks the caller.

  container-scan:
    name: Docker Build & Trivy Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        # Built and scanned only — still never pushed from this job. This
        # job is called by both ci.yml (every PR) and deploy.yml (every
        # merge), and deliberately has no AWS credentials — only a job
        # declaring environment: production gets an OIDC token this
        # project's deploy role trusts (see modules/github-oidc/main.tf's
        # header comment). Publishing now happens in deploy.yml's
        # publish-backend-image job instead, which rebuilds this exact
        # commit's image under that trust boundary after this scan has
        # already passed. See
        # docs/superpowers/specs/2026-07-30-post-sprint4-deploy-and-frontend-hosting-design.md.
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          file: src/backend/Dockerfile
          push: false
          load: true
          tags: pdms-backend:${{ github.sha }}

      - name: Trivy image scan
        # v0.28.0 pinned aquasecurity/setup-trivy@v0.2.1 internally, a tag
        # that no longer exists in that repo (confirmed via the GitHub API —
        # only v0.2.6+ remain, apparently removed in an upstream
        # supply-chain-hardening pass). That made every real run of this
        # step fail at trivy-action's own "Install Trivy" composite step,
        # before Trivy itself ever ran — first surfaced 2026-07-30 by the
        # first actual GitHub Actions run of this pipeline (checkov and
        # local checks can't catch a dead upstream action pin). v0.32.0+
        # pins its setup-trivy dependency by commit hash instead of a tag,
        # specifically to make this class of failure impossible going
        # forward; v0.36.0 was the latest available at the time of this fix.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pdms-backend:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'
          vuln-type: os,library

  iac-scan:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          framework: terraform
          soft_fail: false
          quiet: true
