name: Deploy

# Stage 6 of the 6-stage pipeline (chapter-4 Section 4.3.6): Terraform
# Apply. Triggers on every push to main (i.e. after a PR has been merged).
#
# The `needs: scan` dependency on the terraform-apply job is what actually
# enforces "deploy only runs if all scans pass" — not GitHub's
# branch-protection UI, so this holds even if branch protection is ever
# misconfigured, disabled, or bypassed by an admin merging without a green
# check. If any job inside security-scan.yml fails, terraform-apply is
# skipped entirely by default GitHub Actions job-dependency behaviour; the
# explicit `if:` below is a second, provable guard against that behaviour
# ever being silently changed (e.g. someone later adding `if: always()`).

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false # never cancel a Terraform apply mid-flight — could corrupt state

jobs:
  scan:
    name: Security Gate
    uses: ./.github/workflows/security-scan.yml
    secrets: inherit

  terraform-apply:
    name: Terraform Plan & Apply
    needs: scan
    if: needs.scan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Requires a GitHub Environment named "production" with a required-
    # reviewer protection rule configured in repo Settings > Environments —
    # that approval gate is repo configuration, not expressible in this
    # YAML file, and must be set up out-of-band before this workflow can
    # apply changes to real infrastructure.
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC — no long-lived AWS access keys stored as GitHub secrets
    defaults:
      run:
        working-directory: infrastructure/terraform
    env:
      # Required variables with no default (variables.tf) — supplied as
      # TF_VAR_* from GitHub secrets rather than a committed/generated
      # terraform.tfvars file, per the note already left in
      # terraform.tfvars.example ("In CI/CD, these are supplied as GitHub
      # Actions secrets / OIDC-derived values instead of a committed tfvars
      # file (see Sprint 4)").
      TF_VAR_kms_key_administrator_arns: ${{ secrets.TF_KMS_KEY_ADMINISTRATOR_ARNS }}
      TF_VAR_acm_certificate_arn: ${{ secrets.TF_ACM_CERTIFICATE_ARN }}
      TF_VAR_ec2_ami_id: ${{ secrets.TF_EC2_AMI_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

  publish-backend-image:
    name: Publish Backend Image & Roll Out
    # Infrastructure (the ECR repo, the IAM statements it needs, the
    # tagged EC2 instances) must exist before anything can push to it or
    # target it — hence needs: terraform-apply, not just scan.
    needs: [scan, terraform-apply]
    # Explicit, provable guard (matches terraform-apply's own comment above)
    # against needs: alone ever being silently relied on instead.
    if: needs.scan.result == 'success' && needs.terraform-apply.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform init
        run: terraform init -input=false

      - name: Read Terraform outputs
        id: tf
        run: |
          echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "kms_key_arn=$(terraform output -raw kms_key_arn)" >> "$GITHUB_OUTPUT"
          echo "ssm_app_prefix=$(terraform output -raw ssm_app_parameter_prefix)" >> "$GITHUB_OUTPUT"
          echo "ec2_instance_tag=$(terraform output -raw ec2_instance_tag_name)" >> "$GITHUB_OUTPUT"

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region ap-southeast-1 \
            | docker login --username AWS --password-stdin "${{ steps.tf.outputs.ecr_repository_url }}"

      - name: Build backend image
        working-directory: .
        run: |
          docker build -t "${{ steps.tf.outputs.ecr_repository_url }}:${{ github.sha }}" \
            -f src/backend/Dockerfile src/backend

      - name: Push backend image
        # The ECR repo is IMMUTABLE, so a re-run of this job after a failure
        # in a LATER step (the rollout wait is the likely one) would other-
        # wise die here with ImageTagAlreadyExistsException before it could
        # retry anything useful. The tag is the commit SHA, so an already-
        # present tag is by definition the same source that was just rebuilt.
        run: |
          if docker manifest inspect "${{ steps.tf.outputs.ecr_repository_url }}:${{ github.sha }}" >/dev/null 2>&1; then
            echo "Image already pushed for this commit, skipping."
          else
            docker push "${{ steps.tf.outputs.ecr_repository_url }}:${{ github.sha }}"
          fi

      - name: Record previous tag and set new tag
        # Both parameters are SecureString (Task 4 switched from plain String
        # for consistency with modules/rds's own precedent — see that task's
        # fix-round note) — every read/write needs --with-decryption /
        # --key-id accordingly, not the plain form.
        env:
          SSM_APP_PREFIX: ${{ steps.tf.outputs.ssm_app_prefix }}
          KMS_KEY_ARN: ${{ steps.tf.outputs.kms_key_arn }}
        run: |
          CURRENT_TAG=$(aws ssm get-parameter --name "$SSM_APP_PREFIX/image_tag" --with-decryption --query 'Parameter.Value' --output text)
          aws ssm put-parameter --name "$SSM_APP_PREFIX/previous_image_tag" --value "$CURRENT_TAG" --type SecureString --key-id "$KMS_KEY_ARN" --overwrite
          aws ssm put-parameter --name "$SSM_APP_PREFIX/image_tag" --value "${{ github.sha }}" --type SecureString --key-id "$KMS_KEY_ARN" --overwrite

      - name: Trigger rollout via SSM
        id: rollout
        env:
          INSTANCE_TAG: ${{ steps.tf.outputs.ec2_instance_tag }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=$INSTANCE_TAG" \
            --parameters 'commands=["/opt/pdms/deploy.sh"]' \
            --query 'Command.CommandId' --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for rollout result
        # Bounded two ways, deliberately: the loop's own accounting
        # (MAX_ATTEMPTS * sleep) matches this step's timeout-minutes, so
        # the loop is expected to report a clear failure reason in the
        # normal case; timeout-minutes is the hard backstop for a truly
        # wedged call (e.g. a hung aws CLI invocation that never returns
        # at all). Matches every other gate in this pipeline — no step
        # anywhere hangs indefinitely instead of failing loudly.
        timeout-minutes: 8
        env:
          INSTANCE_TAG: ${{ steps.tf.outputs.ec2_instance_tag }}
        run: |
          COMMAND_ID="${{ steps.rollout.outputs.command_id }}"
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_TAG" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)

          # Without this, zero matching instances means the for loop below
          # never runs and the step exits 0 — reporting a successful rollout
          # that never happened anywhere.
          if [ -z "$INSTANCE_IDS" ]; then
            echo "No running instances found matching tag:Name=$INSTANCE_TAG — cannot verify rollout."
            exit 1
          fi

          MAX_ATTEMPTS=24  # 24 * 20s = 8 minutes, matching this step's own timeout-minutes above
          for INSTANCE_ID in $INSTANCE_IDS; do
            ATTEMPTS=0
            STATUS="Pending"
            while [ "$STATUS" = "Pending" ] || [ "$STATUS" = "InProgress" ]; do
              ATTEMPTS=$((ATTEMPTS + 1))
              if [ "$ATTEMPTS" -gt "$MAX_ATTEMPTS" ]; then
                echo "Timed out waiting for rollout on $INSTANCE_ID after ${MAX_ATTEMPTS} checks"
                exit 1
              fi
              sleep 20
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                --query 'Status' --output text)
            done
            if [ "$STATUS" != "Success" ]; then
              echo "Rollout failed on $INSTANCE_ID: $STATUS"
              exit 1
            fi
            echo "Rollout succeeded on $INSTANCE_ID"
          done

  publish-frontend:
    name: Build & Publish Frontend
    needs: [scan, terraform-apply]
    if: needs.scan.result == 'success' && needs.terraform-apply.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Build
        working-directory: src/frontend
        run: npm run build

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Read Terraform outputs
        id: tf
        working-directory: infrastructure/terraform
        run: |
          terraform init -input=false
          echo "bucket=$(terraform output -raw frontend_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

      - name: Sync to S3
        # Two passes, deliberately ordered. index.html is the only file with
        # a stable name; every asset it references is content-hashed. If the
        # single --delete sync uploaded index.html at the same time as it
        # deleted the previous build's chunks, a browser could fetch the new
        # index.html and then 404 on assets that had not landed yet (or an
        # old index.html referencing chunks already deleted). So: upload all
        # the new hashed assets first (and prune old ones), then flip
        # index.html over to point at them, then invalidate.
        run: |
          aws s3 sync src/frontend/dist "s3://${{ steps.tf.outputs.bucket }}" --delete --exclude index.html
          aws s3 sync src/frontend/dist "s3://${{ steps.tf.outputs.bucket }}" --exclude "*" --include index.html

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.tf.outputs.distribution_id }}" --paths "/*"
